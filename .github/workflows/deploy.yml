name: Publier MathSimple

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Construire le site
        working-directory: frontend
        run: npm run build -- --base=/math-college/
        env:
          VITE_GITHUB_PAGES: "true"

      - name: Preparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4